[project]
name = "investimentos-pipeline"
version = "0.1.0"
description = "Pipeline incremental para coleta de preços de ativos e gestão automatizada de carteira de investimentos"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Douglas Senra", email = "dfsenra@gmail.com" }
]

dependencies = [
  "streamlit==1.53.1",
  "pandas==2.3.3",
  "numpy==2.4.1",
  "yfinance==1.1.0",
  "requests==2.32.5",
  "python-dotenv==1.2.1"
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
